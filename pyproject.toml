[build-system]
requires = ["setuptools>=62.4", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Default line length, same as Black
line-length = 88
# Target Python version (optional, ruff usually infers this.
# However, setup.py lists 3.10-3.13. Let's pick the lowest common denominator for now)
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle error (E) and warning (W) rules, and isort (I).
select = ["E", "F", "I", "W"]

# Exclude common virtual environment folders and build artifacts.
# `your` itself is the main package, so no need to exclude parts of it yet unless specific issues arise.
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.format]
# This enables ruff's formatter. It's black-compatible by default.
# No extra config needed for black compatibility.
# To opt-in to experimental features:
# preview = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
archs = ["native"]
test-command = "python -I {project}/checks/native_parity.py && python -I {project}/checks/native_parity.py --missing-rust"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0"
environment = { PATH = "/tmp/your-cargo/bin:$PATH", CARGO_HOME = "/tmp/your-cargo", RUSTUP_HOME = "/tmp/your-rustup", RUSTUP_TOOLCHAIN = "1.88.0" }
