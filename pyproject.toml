[build-system]
requires = ["setuptools>=62.4", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "you-re"
dynamic = ["version", "dependencies"]
description = "A unified reader for sigproc filterbank and psrfits data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Devansh Agarwal", email = "da0017@mix.wvu.edu" },
    { name = "Kshitij Aggarwal", email = "ka0064@mix.wvu.edu" },
]
classifiers = [
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
cupy-cuda12x = ["cupy-cuda12x>=13.6,<15"]
cupy-cuda13x = ["cupy-cuda13x>=14,<15"]
gpu = ["cupy-cuda12x>=13.6,<15"]

[project.urls]
Homepage = "https://github.com/devanshkv/you-re"

[tool.setuptools.dynamic]
version = { attr = "your.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
"your.utils" = ["*.cu"]

[tool.ruff]
# Default line length, same as Black
line-length = 88
# Target Python version (optional, ruff usually infers this.
# However, setup.py lists 3.10-3.13. Let's pick the lowest common denominator for now)
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle error (E) and warning (W) rules, and isort (I).
select = ["E", "F", "I", "W"]

# Exclude common virtual environment folders and build artifacts.
# `your` itself is the main package, so no need to exclude parts of it yet unless specific issues arise.
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.format]
# This enables ruff's formatter. It's black-compatible by default.
# No extra config needed for black compatibility.
# To opt-in to experimental features:
# preview = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
archs = ["native"]
test-command = "python -I {project}/checks/native_parity.py && python -I {project}/checks/native_parity.py --missing-rust"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0"
environment = { PATH = "/tmp/your-cargo/bin:$PATH", CARGO_HOME = "/tmp/your-cargo", RUSTUP_HOME = "/tmp/your-rustup", RUSTUP_TOOLCHAIN = "1.88.0" }
