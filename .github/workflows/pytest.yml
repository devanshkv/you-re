name: Python package

on: [push, pull_request]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.83.0", "1.88.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Rust tools
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        if: matrix.rust == '1.88.0'
        run: cargo +1.88.0 fmt --manifest-path rust/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo +${{ matrix.rust }} clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Rust kernels
        run: cargo +${{ matrix.rust }} test --manifest-path rust/Cargo.toml --locked

  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install it
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: |
          pip install .
      - name: Require native extension and compare fallback
        run: python -I checks/native_parity.py
      - name: Verify extension-absent fallback
        run: python -I checks/native_parity.py --fallback-only
      - name: Ruff Format Check
        run: ruff format . --check
      - name: Run pytest and Generate coverage report
        run: |
          pip install pytest pytest-cov
          python -m pytest --cov=your --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          name: codecov-umbrella
          fail_ci_if_error: true
