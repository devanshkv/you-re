name: Publish your to PyPI and TestPyPI

on: push

jobs:
  sdist:
    name: Build and test source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Rust and build tools
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          python -m pip install build
      - name: Build and install source distribution
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: |
          python -m build --sdist
          python -m pip install dist/*.tar.gz
          python -I checks/native_parity.py
          python -I checks/native_parity.py --fallback-only
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-sdist
          path: dist/*.tar.gz

  wheels:
    name: Build and test native wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Rust on host
        if: runner.os != 'Linux'
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-to-pypi:
    name: >-
      Publish your to PyPI
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'  # only publish to PyPI on tag pushes or GitHub releases
    needs:
    - sdist
    - wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/your
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: distribution-*
        merge-multiple: true
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
  # Only thepetabyteproject can publish to TestPyPI, so skip for others, otherwise other CI tests are stopped.
    if: github.repository_owner == 'thepetabyteproject'  
    name: Publish your TestPyPI
    needs:
    - sdist
    - wheels
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/your

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: distribution-*
        merge-multiple: true
        path: dist/
    - name: Publish your TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        repository-url: https://test.pypi.org/legacy/